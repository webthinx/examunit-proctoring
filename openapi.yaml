components:
  schemas:
    CandidatePayload:
      properties:
        Id:
          description: ID
          type: integer
        Name:
          description: 'Full name'
          type: string
        FirstName:
          description: 'First name'
          type: string
        LastName:
          description: 'Last name'
          type: string
        Email:
          description: Email
          type: string
          format: email
        Token:
          description: 'Unique token'
          type: string
        SessionToken:
          description: 'Same as Token, compatibility reasons'
          type: string
          deprecated: true
        Url:
          description: 'URL to the proctoring application where the candidate will be examined'
          type: string
          format: uri
        SystemCheckUrl:
          description: 'URL to the proctoring application where candidate performs system-check'
          type: string
          format: uri
        ExamId:
          description: 'ID of the exam'
          type: integer
        ExamFirstStartTime:
          description: 'Start time for exam'
          type: string
          format: date-time
        ExamLastStartTime:
          description: 'Latest possible start time for exam'
          type: string
          format: date-time
        AutoAssignProctor:
          description: 'Proctor auto assignment is enabled'
          type: boolean
        AssignedProctorId:
          description: 'Pre-assigned proctor id'
          type: integer
          nullable: true
        AssignedProctorName:
          description: 'Pre-assigned proctor name'
          type: string
          nullable: true
        PhotoUrl:
          description: 'URL to face photo'
          type: string
          format: uri
          nullable: true
        IdentificationPhotoUrl:
          description: 'URL to id card photo'
          type: string
          format: uri
          nullable: true
        StartSessionTime:
          description: 'Start time'
          type: string
          format: date-time
          nullable: true
        EndSessionTime:
          description: 'End time'
          type: string
          format: date-time
          nullable: true
        ExamTotalTime:
          description: 'Session duration (end - start)'
          type: string
          nullable: true
        SessionStatus:
          description: 'Status of the session'
          type: string
          enum:
            - NONE
            - JOINED
            - APPROVAL_REQUESTED
            - APPROVED
            - STARTED
            - FINISHED
            - DISMISSED
            - CLOSED
        Status:
          description: 'Status of the session, with "exam_started" instead of "STARTED" for compatibility reasons.'
          type: string
          deprecated: true
        CreatedAt:
          description: 'Created at'
          type: string
          format: date-time
        UpdatedAt:
          description: 'Last updated at'
          type: string
          format: date-time
      type: object
    CandidateRequest:
      type: object
      allOf:
        -
          $ref: '#/components/schemas/SimpleRequest'
        -
          properties:
            id:
              description: 'Contains examId (for create request) or candidateId (for update request)'
              type: integer
              nullable: false
              deprecated: true
            examId:
              description: 'ID of exam'
              type: integer
              nullable: false
            email:
              description: 'Email of the candidate'
              type: string
              format: email
              nullable: false
            name:
              description: 'Full name of the candidate'
              type: string
              nullable: false
              deprecated: true
            firstName:
              description: 'First name of the candidate'
              type: string
              nullable: false
            lastName:
              description: 'Last name of the candidate'
              type: string
              nullable: false
            individual_info:
              description: 'Individual info containing HTML with iframeUrl, compatibility reasons'
              type: string
              nullable: true
              deprecated: true
            iframeUrl:
              description: 'URL for the candidates exam'
              type: string
              format: uri
              nullable: true
    ExamDocumentPayload:
      properties:
        Id:
          type: integer
        Exam_id:
          type: integer
        Exam_content:
          type: string
        Created_at:
          type: string
        Updated_at:
          type: string
      type: object
    ExamDocumentRequest:
      type: object
      allOf:
        -
          $ref: '#/components/schemas/SimpleRequest'
        -
          properties:
            content:
              description: 'Content of infoForCandidates field'
              type: string
    ExamPayload:
      properties:
        Id:
          description: ID
          type: integer
        InstituteId:
          description: 'ID of institute'
          type: integer
        Name:
          description: Name
          type: string
        Type:
          description: 'Type - currently only "LIVE_PROCTORING is supported"'
          type: string
          enum:
            - LIVE_PROCTORING
            - RECORD_REVIEW
        Status:
          description: 'Status of the exam'
          type: string
          enum:
            - UPCOMING
            - RUNNING
            - CLOSING
            - COMPLETED
        DurationMinutes:
          description: 'Exam duration in minutes'
          type: integer
        FirstStartTime:
          description: 'First possible time to start exam (when exam opens)'
          type: string
          format: date-time
        LastStartTime:
          description: 'Last possible time to start exam (before exam closes)'
          type: string
          format: date-time
        SavePersonalData:
          description: 'Whether to save data about candidates'
          type: boolean
        CreatedAt:
          description: 'Created at'
          type: string
          format: date-time
        UpdatedAt:
          description: 'Last updated at'
          type: string
          format: date-time
      type: object
    ExamRequest:
      type: object
      allOf:
        -
          $ref: '#/components/schemas/SimpleRequest'
        -
          properties:
            name:
              description: Name
              type: string
              nullable: false
            type:
              description: 'Type of exam, lowercase values are deprecated'
              enum:
                - LIVE_PROCTORING
                - RECORD_REVIEW
                - live_proctoring
                - record_review
              nullable: false
            duration_minutes:
              description: 'Use durationMinutes'
              type: integer
              nullable: false
              deprecated: true
            durationMinutes:
              description: 'Duration in minutes'
              type: integer
              nullable: false
            start_time:
              description: 'Use firstStartTime'
              nullable: false
              deprecated: true

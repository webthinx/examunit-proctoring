components:
  schemas:
    CandidatePayload:
      properties:
        Id:
          description: ID
          type: integer
        Name:
          description: 'Full name'
          type: string
        FirstName:
          description: 'First name'
          type: string
        LastName:
          description: 'Last name'
          type: string
        Email:
          description: Email
          type: string
          format: email
        Individual_info:
          description: 'ID of the candidate'
          type: string
          nullable: true
          deprecated: true
        AdditionalInfo:
          description: 'ID of the candidate'
          type: string
          nullable: true
          deprecated: true
        Token:
          description: 'Unique token'
          type: string
        SessionToken:
          description: 'Same as Token, compatibility reasons'
          type: string
          deprecated: true
        ExamId:
          description: 'ID of the exam'
          type: integer
        ExamFirstStartTime:
          description: 'Start time for exam'
          type: string
        ExamLastStartTime:
          description: 'Latest possible start time for exam'
          type: string
        AutoAssignProctor:
          description: 'Proctor auto assignment is enabled'
          type: boolean
        AssignedProctorId:
          description: 'Pre-assigned proctor id'
          type: integer
          nullable: true
        AssignedProctorName:
          description: 'Pre-assigned proctor name'
          type: string
          nullable: true
        PhotoUrl:
          description: 'URL to face photo'
          type: string
          nullable: true
        IdentificationPhotoUrl:
          description: 'URL to id card photo'
          type: string
          nullable: true
        StartSessionTime:
          description: 'Start time'
          type: string
          nullable: true
        EndSessionTime:
          description: 'End time'
          type: string
          nullable: true
        ExamTotalTime:
          description: 'Exam total time (end - start)'
          type: string
          nullable: true
        SessionStatus:
          description: 'Status of the session'
          type: string
        Status:
          description: 'Status of the session, with "exam_started" instead of "STARTED" for compatibility reasons.'
          type: string
          deprecated: true
      type: object
    CandidateRequest:
      type: object
      allOf:
        -
          $ref: '#/components/schemas/SimpleRequest'
        -
          properties:
            id:
              description: 'Contains examId (for create request) or candidateId (for update request)'
              type: integer
              nullable: false
              deprecated: true
            examId:
              description: 'ID of exam'
              type: integer
              nullable: false
            email:
              description: 'Email of the candidate'
              type: string
              format: email
              nullable: false
            name:
              description: 'Full name of the candidate'
              type: string
              nullable: false
              deprecated: true
            firstName:
              description: 'First name of the candidate'
              type: string
              nullable: false
            lastName:
              description: 'Last name of the candidate'
              type: string
              nullable: false
            individual_info:
              description: 'Individual info containing HTML with iframeUrl, compatibility reasons'
              type: string
              nullable: true
              deprecated: true
            iframeUrl:
              description: 'URL for the candidates exam'
              type: string
              format: uri
              nullable: true
    ExamDocumentPayload:
      properties:
        Id:
          type: integer
        Exam_id:
          type: integer
        Exam_content:
          type: string
        Created_at:
          type: string
        Updated_at:
          type: string
      type: object
    ExamDocumentRequest:
      type: object
      allOf:
        -
          $ref: '#/components/schemas/SimpleRequest'
        -
          properties:
            content:
              description: 'Content of infoForCandidates field'
              type: string
    ExamPayload:
      properties:
        Id:
          description: ID
          type: integer
        Institute_Id:
          description: 'Use InstituteId'
          type: integer
          deprecated: true
        InstituteId:
          description: 'ID of institute'
          type: integer
        Name:
          description: Name
          type: string
        Type:
          description: 'Type - currently only "live_proctoring"'
          type: string
        Status:
          description: 'Status of the exam'
          type: string
        Duration_minutes:
          description: 'Use DurationMinutes'
          type: integer
          deprecated: true
        DurationMinutes:
          description: 'Exam duration in minutes'
          type: integer
        Use_duration:
          type: boolean
          deprecated: true
        Start_time:
          description: 'Use FirstStartTime'
          type: string
          deprecated: true
        FirstStartTime:
          description: 'First possible time to start exam (when exam opens)'
          type: string
        End_time:
          description: 'Use LastStartTime'
          type: string
          deprecated: true
        LastStartTime:
          description: 'Last possible time to start exam (before exam closes)'
          type: string
        Live_proctoring:
          type: boolean
          deprecated: true
        save_personaldata:
          description: 'Use SavePersonalData'
          type: boolean
          deprecated: true
        SavePersonalData:
          description: 'Whether to save data about candidates'
          type: boolean
        Created_at:
          description: 'Use CreatedAt'
          type: string
          deprecated: true
        CreatedAt:
          description: 'Created at'
          type: string
        Updated_at:
          description: 'Use UpdatedAt'
          type: string
          deprecated: true
        UpdatedAt:
          description: 'Last updated at'
          type: string
      type: object
    ExamRequest:
      type: object
      allOf:
        -
          $ref: '#/components/schemas/SimpleRequest'
        -
          properties:
            name:
              description: Name
              type: string
              nullable: false
            type:
              description: 'Type of exam, currently only "live_proctoring"'
              nullable: false
            duration_minutes:
              description: 'Use durationMinutes'
              type: integer
              nullable: false
              deprecated: true
            durationMinutes:
              description: 'Duration in minutes'
              type: integer
              nullable: false
            start_time:
              description: 'Use firstStartTime'
              nullable: false
              deprecated: true
            firstStartTime:
              description: 'Earliest possible time to start an exam, timestamp in UTC+2'
              type: number
              format: float
              nullable: false
            end_time:
              description: 'Use lastStartTime'
              nullable: true
              deprecated: true
